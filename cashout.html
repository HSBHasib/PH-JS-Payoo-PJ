<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>
    <!-- Logo -->
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon">

    <!-- Daisy CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Add font Family -->
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen mx-auto bg-base-200
            md:max-w-md">
    
    <header class="border-b-[1.5px] border-gray-300 max-[500px]:bg-white">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <!-- Left part -->
        <div>
            <!-- Img -->
            <div class="inline-block items-center mr-1">
                <img class="w-[52px]" 
                src="./assets/logo.png" alt="payoo-logo">
            </div>

            <!-- Balance -->
            <div class="inline-block">
                <h3 class="text-[#080808] text-[17px] font-extrabold">$<span id="balance">45000</span></h3>
                <p class="text-neutral/50 text-[14px]">Available Balance</p>
            </div>
        </div>
            
        <!-- Right part -->
        <div>
            <a href="./index.html" class="btn rounded-md btn text-[#666768]"><i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i> <span class="font-normal">Log Out</span></a>
        </div>
        </section>
    </header>

    <main>
        <!-- Welcome Payoo Section -->
        <section class="max-[500px]:bg-white rounded-b-3xl">
            <div class="py-5 space-y-1 w-11/12 mx-auto ">
                <h2 class="text-[24px] font-semibold">
                    Welcome to Pay<span class="text-primary">oo</span>
                </h2>
                <p class="text-neutral/50 text-[14px]">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

                <!-- Buttons -->
                <div class="h-full grid grid-cols-3 gap-4 mt-6">
                    <button class="btn btn-primary btn-soft flex-col px-5 py-11 rounded-xl">
                        <img src="./assets/opt-1.png" alt="btn-img-1">
                        <p class="text-[13px]">Add Money</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-5 py-11 rounded-xl">
                        <img src="./assets/opt-2.png" alt="btn-img-1">
                        <p>Cashout</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-5 py-11 rounded-xl">
                        <img src="./assets/opt-3.png" alt="btn-img-1">
                        <p>Transfer Money</p>
                    </button>
    
                    <button class="btn btn-primary btn-soft flex-col px-5 py-11 rounded-xl">
                        <img src="./assets/opt-4.png" alt="btn-img-1">
                        <p>Get Bonus</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-5 py-11 rounded-xl">
                        <img src="./assets/opt-5.png" alt="btn-img-1">
                        <p>Pay Bill</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-5 py-11 rounded-xl">
                        <img src="./assets/opt-6.png" alt="btn-img-1">
                        <p>Transactions</p>
                    </button>
                </div>
            </div>    
        </section>

        <!-- Letest Payment | Cashout-->
       
        <div class="w-full max-w-sm mx-auto pb-20">
            <h1 class="text-[18px] font-semibold mb-3">Cash Out</h1>
            
            <div class="card bg-base-100 shrink-0 shadow
                    rounded-3xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <!-- Bank -->
                    
                        <label class="label text-neutral text-[15px] font-medium">Agent Number</label>
                        <input id="input-num" class="rounded-full h-[46px] p-4 
                        bg-base-200 text-[#080808] font-light 
                        border-0 text-[14px] mb-3" 
                        type="text" class="input" placeholder="Enter 11 digit number" />
                    
                    

                    <!-- Back Accunt Number -->
                    
                        <label class="label text-neutral text-[15px] font-medium">Amount</label>
                        <input id="input-pin" class="rounded-full h-[46px] p-4 
                        bg-base-200 text-[#080808] font-light 
                        border-0 text-[14px] mb-3" 
                        maxlength="11" minlength="11" 
                        type="password" class="input" placeholder="Enter amount to withdraw" />


                    <!-- Pin Number -->                    
                        <label class="label text-neutral text-[15px] font-medium">Pin Number</label>
                        <input id="input-num" class="rounded-full h-[46px] p-4 
                        bg-base-200 text-[#080808] font-light 
                        border-0 text-[14px] mb-3" 
                        type="text" class="input" placeholder="Enter 4 digit pin number" />
                    

                    
                        
                    <button id="addMoney-btn" class="btn btn-neutral mt-4 bg-primary text-white
                                rounded-full h-[46px] p-4 
                                font-semibold border-0 text-[17.5px]">
                            Withdraw Money</button>
                </fieldset>
            </div>
        </div>
    </div>
    </main>

    <script src="./script/login.js"></script>
</body>
</html>

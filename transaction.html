<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta  
    content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    ">
    <title>Payoo | Transaction</title>
    <!-- Logo -->
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon">

    <!-- Daisy CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Add font Family -->
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen mx-auto bg-base-200
            md:max-w-md">
    
    <header class="border-b-[1.5px] border-gray-300 max-[500px]:bg-white">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <!-- Left part -->
        <div>
            <!-- Img -->
            <div class="inline-block items-center mr-1">
                <img class="w-[52px]" 
                src="./assets/logo.png" alt="payoo-logo">
            </div>

            <!-- Balance -->
            <div class="inline-block">
                <h3 class="text-[#080808] text-[17px] font-extrabold">$<span id="balance">45000</span></h3>
                <p class="text-neutral/50 text-[14px]">Available Balance</p>
            </div>
        </div>
            
        <!-- Right part -->
        <div>
            <a href="./index.html" class="btn rounded-md btn text-[#666768]"><i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i> <span class="font-normal">Log Out</span></a>
        </div>
        </section>
    </header>

    <main>
        <!-- Welcome Payoo Section -->
        <section class="max-[500px]:bg-white rounded-b-3xl
                        max-[500px]:pt-5 max-[500px]:pb-6">
            <div class="py-5 space-y-1 w-11/12 mx-auto ">
                <h2 class="text-[24px] font-semibold">
                    Welcome to Pay<span class="text-primary">oo</span>
                </h2>
                <p class="text-neutral/50 text-[14px]">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

                <!-- Buttons -->
                <div class="h-full grid grid-cols-3 gap-4 mt-6">
                    <button class="btn btn-primary btn-soft flex-col px-2 py-11 rounded-xl">
                        <img src="./assets/opt-1.png" alt="btn-img-1">
                        <p class="text-[13px]">Add Money</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-2 py-11 rounded-xl">
                        <img src="./assets/opt-2.png" alt="btn-img-2">
                        <p>Cashout</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-2 py-11 rounded-xl">
                        <img src="./assets/opt-3.png" alt="btn-img-3">
                        <p>Transfer Money</p>
                    </button>
    
                    <button class="btn btn-primary btn-soft flex-col px-2 py-11 rounded-xl">
                        <img src="./assets/opt-4.png" alt="btn-img-4">
                        <p>Get Bonus</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-2 py-11 rounded-xl">
                        <img src="./assets/opt-5.png" alt="btn-img-5">
                        <p>Pay Bill</p>
                    </button>

                    <button class="btn btn-primary btn-soft flex-col px-2 py-11 rounded-xl">
                        <img src="./assets/opt-6.png" alt="btn-img-6">
                        <p>Transactions</p>
                    </button>
                </div>
            </div>    
        </section>

        <!-- Transaction -->
        <section class="mt-3 pb-20 max-[500px]:mt-4">
            <div class="flex justify-between items-center  w-11/12 mx-auto">
                <h2 class="font-bold text-[20px]">Transaction History</h2>
                <p class="text-[14px] text-neutral/50">View All</p>
            </div>

            <!-- Letest Payment Card -->
            <div class="w-11/12 mx-auto py-4 space-y-3">
                <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg shadow ">
                    <div class="flex items-center gap-2">
                        <div class="h-11 w-11 bg-[#F2F2F2] flex justify-center items-center rounded-full">
                            <img class="w-6 h-6" src="./assets/opt-1.png" alt="card-img">
                        </div>

                        <div>
                            <h5 class="text-[16px] text-[#525252] font-semibold">Electricity Bill</h5>
                            <p class="text-[12px] text-[#525252]">Today 1:44 AM</p>
                        </div>
                    </div>

                    
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
                
                 <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg shadow ">
                    <div class="flex items-center gap-2">
                        <div class="h-11 w-11 bg-[#F2F2F2] flex justify-center items-center rounded-full">
                            <img class="w-6 h-6" src="./assets/opt-1.png" alt="card-img">
                        </div>

                        <div>
                            <h5 class="text-[16px] text-[#525252] font-semibold">Bank Deposit</h5>
                            <p class="text-[12px] text-[#525252]">Today 2:10 AM</p>
                        </div>
                    </div>

                    
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>

                 <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg shadow ">
                    <div class="flex items-center gap-2">
                        <div class="h-11 w-11 bg-[#F2F2F2] flex justify-center items-center rounded-full">
                            <img class="w-6 h-6" src="./assets/opt-1.png" alt="card-img">
                        </div>

                        <div>
                            <h5 class="text-[16px] text-[#525252] font-semibold">Mobile Recharge</h5>
                            <p class="text-[12px] text-[#525252]">Today 2:25 AM</p>
                        </div>
                    </div>

                    
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>

                 <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg shadow ">
                    <div class="flex items-center gap-2">
                        <div class="h-11 w-11 bg-[#F2F2F2] flex justify-center items-center rounded-full">
                            <img class="w-6 h-6" src="./assets/opt-1.png" alt="card-img">
                        </div>

                        <div>
                            <h5 class="text-[16px] text-[#525252] font-semibold">Gas Bill</h5>
                            <p class="text-[12px] text-[#525252]">Today 3:43 AM</p>
                        </div>
                    </div>

                    
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
                
            </div>
        </section>
    </main>

    <script src="./script/shared.js"></script>
    <script src="./script/transition.js"></script>
</body>
</html>
